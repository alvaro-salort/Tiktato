<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiktato · Frasco de donaciones</title>
    <link rel="stylesheet" href="/jar.css" />
  </head>
  <body>
    <div class="stage">
      <div id="jarScene" class="jar-scene">
        <div class="jar-heading">
          <span class="eyebrow">TIKTATO</span>
          <h1 id="jarTitle">Frasco de donaciones</h1>
        </div>

        <div class="jar-shell">
          <div class="jar-lid"></div>
          <div class="jar-glass">
            <div id="jarLiquid" class="jar-liquid"></div>
            <div class="jar-shine"></div>
            <div id="jarGifts" class="jar-gifts"></div>
          </div>
          <div class="jar-shadow"></div>
        </div>

        <div class="jar-meta">
          <strong id="jarAmount">0 / 1.000</strong>
          <span id="jarPercent">0%</span>
        </div>
        <div id="jarCaption" class="jar-caption">monedas para llenar el frasco</div>
        <div id="jarComplete" class="jar-complete" hidden>Meta completada</div>
      </div>
    </div>

    <script type="module" src="/jar.js"></script>
  </body>
</html>

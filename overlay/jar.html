<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiktato · Frasco de donaciones</title>
    <link rel="stylesheet" href="/jar.css" />
    <script src="/matter.min.js"></script>
  </head>
  <body>
    <div id="jarApp" class="jar-viewport">
      <!-- Layer 0: Vidrio Trasero / Fondo -->
      <div id="jarLayerBack" class="jar-layer layer-back" aria-hidden="true">
        <img src="/assets/jar-back.svg" class="jar-svg-back" alt="" />
      </div>

      <!-- Layer 1: Canvas Matter.js (Física 2D de regalos) -->
      <div id="jarCanvasContainer" class="jar-layer layer-canvas"></div>

      <!-- Layer 2: Vidrio Frontal + HUD Superpuesto -->
      <div id="jarLayerFront" class="jar-layer layer-front">
        <img src="/assets/jar-front.svg" class="jar-svg-front" alt="" aria-hidden="true" />

        <!-- Contador de Monedas Totales (Cápsula superior) -->
        <div id="jarTotalCoins" class="jar-total-coins">
          <span class="coin-icon-wrap">
            <img src="/assets/coin-icon.svg" class="coin-icon" alt="" />
          </span>
          <span id="totalCoinsCount" class="total-coins-count">0</span>
        </div>

        <!-- Alerta Emergente de Regalo (Bocadillo de cómic) -->
        <div id="jarAlertBubble" class="jar-alert-bubble" aria-live="polite">
          <div class="alert-bubble-content">
            <div class="alert-avatar-wrap">
              <img id="alertAvatar" class="alert-avatar" src="/assets/coin-icon.svg" alt="" />
              <span id="alertAvatarFallback" class="alert-avatar-fallback">T</span>
            </div>
            <div class="alert-text-wrap">
              <div class="alert-line-user">
                <strong id="alertUsername" class="alert-username">Alguien</strong>
                <span class="alert-action">donó</span>
              </div>
              <div class="alert-line-gift">
                <img id="alertGiftIcon" class="alert-gift-icon" src="/assets/coin-icon.svg" alt="" />
                <span id="alertGiftName" class="alert-gift-name">Rosa</span>
                <span id="alertRepeatCount" class="alert-repeat-count">x1</span>
                <span id="alertCoinsValue" class="alert-coins-value">(1 moneda)</span>
              </div>
            </div>
          </div>
          <!-- Puntero en forma de flecha apuntando a la boca del tarro -->
          <svg class="alert-pointer" viewBox="0 0 33 20" aria-hidden="true">
            <path d="M33 19.5C18.6 19.5 9 14 0 0H31.5C14 0 43 19.5 33 19.5Z" fill="#282828" fill-opacity="0.9" />
          </svg>
        </div>

        <!-- Leaderboard Rotativo de Donantes Destacados -->
        <div id="jarLeaderboard" class="jar-leaderboard">
          <div class="leaderboard-card">
            <div class="leaderboard-rank-wrap">
              <img id="leaderboardMedal" class="leaderboard-medal" src="/assets/first.svg" alt="Rango" />
              <span id="leaderboardRankText" class="leaderboard-rank-text" hidden>1.</span>
            </div>
            <div class="leaderboard-avatar-wrap">
              <img id="leaderboardAvatar" class="leaderboard-avatar" src="/assets/coin-icon.svg" alt="" />
              <span id="leaderboardAvatarFallback" class="leaderboard-avatar-fallback">T</span>
            </div>
            <div class="leaderboard-info">
              <strong id="leaderboardUsername" class="leaderboard-username">Esperando donaciones...</strong>
              <span id="leaderboardCoinsWrap" class="leaderboard-coins-wrap">
                <img src="/assets/coin-icon.svg" class="leaderboard-coin-icon" alt="" />
                <span id="leaderboardCoins">0</span>
              </span>
            </div>
            <!-- Barra de progreso temporizada -->
            <div class="leaderboard-progress-track">
              <div id="leaderboardProgressBar" class="leaderboard-progress-bar"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Barra flotante auto-ocultable para TikTok LIVE Studio (Captura de ventana) -->
      <div id="studioHud" class="studio-hud" hidden>
        <span class="studio-hud-badge">LIVE STUDIO</span>
        <div class="studio-hud-actions">
          <button class="studio-bg-btn" data-bg="green" type="button" title="Fondo verde para Clave de color (Chroma Key)">Verde Chroma</button>
          <button class="studio-bg-btn" data-bg="dark" type="button" title="Fondo oscuro elegante">Oscuro</button>
          <button class="studio-bg-btn" data-bg="blue" type="button" title="Fondo azul para Clave de color">Azul Chroma</button>
          <button class="studio-bg-btn" data-bg="magenta" type="button" title="Fondo magenta para Clave de color">Magenta</button>
          <button class="studio-bg-btn" data-bg="transparent" type="button" title="Sin color de fondo">Transparente</button>
        </div>
      </div>

      <!-- Barra de herramientas para Frasco de Prueba / Demo -->
      <div id="testHud" class="test-hud" hidden>
        <span class="test-hud-badge">MODO PRUEBA</span>
        <div class="test-hud-actions">
          <button id="btnTestRose" class="test-btn" type="button">+ Rosa (1)</button>
          <button id="btnTestCombo" class="test-btn" type="button">+ Combo x10</button>
          <button id="btnTestGalaxy" class="test-btn" type="button">+ Galaxia (1.000)</button>
          <button id="btnTestUniverse" class="test-btn" type="button">+ Universo (44.999)</button>
          <button id="btnTestToggleDemo" class="test-btn" type="button">Pausar demo</button>
          <button id="btnTestReset" class="test-btn test-btn-danger" type="button">Vaciar</button>
        </div>
      </div>
    </div>

    <script type="module" src="/jar.js"></script>
  </body>
</html>

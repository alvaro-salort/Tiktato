name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar automáticamente en GitHub Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'

jobs:
  build-windows:
    name: Build Windows (NSIS & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows installer (NSIS & Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish never

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release != false
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            "v$($pkg.version)"
          }
          Write-Host "Publicando release $tag..."
          $files = Get-ChildItem -Path "dist\*.exe", "dist\*.blockmap", "dist\latest.yml" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (-not $files -or $files.Count -eq 0) {
            throw "No se encontraron instaladores en dist/"
          }
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --draft=false --latest
          } else {
            gh release create $tag @files --title "Tiktato $tag" --generate-notes --latest
          }

      - name: Upload Windows installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tiktato-Windows-Installers
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
